<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=['bone','stomach','heart','lungs','brain','flask','kidney','skin','food'];
const kinds={indication:'Заалттай холбоотой',context:'Заалтыг шалгах',symptom:'Шинж тэмдгийн үед',nutrition:'Шим тэжээлийн дэмжлэг'};
let state=null,revision=null, tab='settings', selectedCategory='pain', selectedProduct='', selectedDiagnosis='',dirty=false;
function notify(s,error=false,success=false){$('notice').innerHTML=`<div class="status ${error?'error':success?'success':''}">${esc(s)}</div>`;if(success)setTimeout(()=>{if($('notice'))$('notice').innerHTML=''},6500);}
function mark(){dirty=true;$('dirty').textContent='Нийтлээгүй засвар байна';$('dirty').classList.remove('saved');$('save').disabled=false;}
function clean(){dirty=false;$('dirty').textContent='Хадгалсан хувилбар';$('dirty').classList.add('saved');$('save').disabled=true;}
function header(title,subtitle,actions=''){return `<div class="row between"><div><h2>${title}</h2><p class="sectiondesc">${subtitle}</p></div>${actions}</div>`;}
function field(label,key,value,opts={}){let component=opts.textarea?`<textarea data-key="${esc(key)}" ${opts.required?'required':''}>${esc(value)}</textarea>`:`<input data-key="${esc(key)}" type="${opts.type||'text'}" value="${esc(value)}" ${opts.required?'required':''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}>`;return `<div class="field"><label>${label}</label>${component}</div>`;}
function catName(id){return state.categories.find(c=>c.id===id)?.short||id;}
function saveInputs(form,target){form.querySelectorAll('[data-key]').forEach(e=>{const v=e.type==='number'?Number(e.value):e.value;target[e.dataset.key]=v;});}

function imageInput(label,key,value,kind='icon'){
 const img=value?`<img class="previewImg" src="${esc(value)}" alt="Зургийн урьдчилсан харагдац" loading="lazy">`:'<span class="hint">Зураг сонгоогүй байна.</span>';
 return `<div class="uploadZone"><label><strong>${label}</strong></label><div class="mediaRow">${img}</div><input type="file" accept="image/png,image/jpeg,image/webp" data-media-key="${esc(key)}" data-media-kind="${esc(kind)}" aria-label="${label}"><div class="hint">PNG, JPG эсвэл WEBP · Автоматаар жижигрүүлнэ · Нийтлэх хүртэл сайт дээр харагдахгүй</div><button class="btn" type="button" data-remove-media="${esc(key)}" ${value?'':'disabled'}>Зураг арилгах</button></div>`;
}
const fontNames=['Inter','Arial','Georgia','Tahoma','Verdana','Trebuchet MS','Times New Roman','Segoe UI'];
function fontSelect(label,key,value){return `<div class="field"><label>${label}</label><select data-key="${key}">${fontNames.map(name=>`<option value="${esc(name)}" ${name===(value||'Inter')?'selected':''}>${esc(name)}</option>`).join('')}</select></div>`;}
const fontStacks={'Inter':'Inter,"Segoe UI",Arial,sans-serif','Arial':'Arial,"Segoe UI",sans-serif','Georgia':'Georgia,"Times New Roman",serif','Tahoma':'Tahoma,Arial,sans-serif','Verdana':'Verdana,Arial,sans-serif','Trebuchet MS':'"Trebuchet MS",Arial,sans-serif','Times New Roman':'"Times New Roman",Georgia,serif','Segoe UI':'"Segoe UI",Arial,sans-serif'};
async function compactImage(file,kind){
 if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('Зөвхөн PNG, JPG, WEBP зураг сонгоно.');
 if(file.size>12000000)throw new Error('Оруулах зураг 12 MB-аас бага байх ёстой.');
 const local=URL.createObjectURL(file);
 let img;try{img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Зургийг уншиж чадсангүй.'));i.src=local;});}finally{URL.revokeObjectURL(local)}
 if(img.naturalWidth*img.naturalHeight>35000000)throw new Error('Зургийн нягтаршил хэт өндөр байна.');
 const limits={icon:[256,256],logo:[850,260],hero:[1800,950],page:[1600,1050]};
 let [maxW,maxH]=limits[kind]||limits.icon;
 let scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
 for(let attempt=0;attempt<12;attempt++){
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const quality=Math.max(.48,.86-attempt*.05);
  const dataUrl=canvas.toDataURL('image/webp',quality);
  if(dataUrl.startsWith('data:image/webp;base64,') && dataUrl.length<980000)return dataUrl;
  scale*=.83;
 }
 throw new Error('Зургийн хэмжээ багасаж чадсангүй. Өөр жижиг зураг сонгоно уу.');
}
async function uploadMedia(file,kind){
 const dataUrl=await compactImage(file,kind);
 const r=await fetch('/admin/api/media',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-icd10-request':'1'},body:JSON.stringify({dataUrl})});
 let result;try{result=await r.json()}catch{throw new Error('Upload API JSON биш хариу өглөө. Pages Functions шинэчлэгдсэн эсэхийг шалгана уу.')}
 if(!r.ok)throw new Error(result.error||'Зураг upload хийхэд алдаа гарлаа.');
 return result.url;
}
function wireMediaUpload(holder,target,rerender){
 holder.querySelectorAll('[data-media-key]').forEach(el=>el.onchange=async()=>{
  const file=el.files?.[0];if(!file)return;
  const key=el.dataset.mediaKey;el.disabled=true;notify('Зураг хадгалж байна…');
  try{target[key]=await uploadMedia(file,el.dataset.mediaKind);mark();rerender();notify('Зураг хадгаллаа. Баруун дээд талын «Өөрчлөлт нийтлэх» дарж сайт дээр харуулна.',false,true)}
  catch(err){el.disabled=false;notify(err.message,true)}
 });
 holder.querySelectorAll('[data-remove-media]').forEach(b=>b.onclick=()=>{target[b.dataset.removeMedia]='';mark();rerender()});
}
function renderSettings(){
 const s=state.settings;
 const colors={heroTitleColor:s.heroTitleColor||'#ffffff',heroSubtitleColor:s.heroSubtitleColor||'#c5e4e4',heroEyebrowColor:s.heroEyebrowColor||'#aeebe3',heroBadgeColor:s.heroBadgeColor||'#ffffff',
 bodyTextColor:s.bodyTextColor||'#142a3a',mutedTextColor:s.mutedTextColor||'#617285',sectionTitleColor:s.sectionTitleColor||'#142a3a',categoryTitleColor:s.categoryTitleColor||'#142a3a',categorySubtitleColor:s.categorySubtitleColor||'#6d7e8c',diagnosisTitleColor:s.diagnosisTitleColor||'#142a3a',linkTextColor:s.linkTextColor||'#08757c',buttonTextColor:s.buttonTextColor||'#ffffff',footerTextColor:s.footerTextColor||'#617285'};
 $('workspace').innerHTML=header('Загвар ба текст','Лого, дэвсгэр зураг, icon, фонт, бүх бичвэрийн өнгө, хэмжээ эндээс солигдоно. «Нийтлэх» хүртэл нийтийн сайт өөрчлөгдөхгүй.')+
 `<div class="preview" id="sample"><img id="sampleLogo" class="previewImg" style="display:${s.logoImage?'block':'none'};width:${Number(s.logoWidth)||130}px;max-height:70px;background:transparent;border:0" src="${esc(s.logoImage||'')}" alt=""><div class="sampleTop"><div id="sampleEyebrow" class="eyebrow">${esc(s.eyebrow)}</div><span class="samplePill" id="sampleBadge">ӨОУА-10 · Сонгомол кодын сан</span></div><strong id="sampleTitle">${esc(s.title)}</strong><div id="sampleSub">${esc(s.subtitle)}</div></div><hr class="divider">`+
 `<h3 class="themeSection">1. Сайтын гарчиг болон лого</h3><div class="fields2"><div>${field('Сайтын гарчиг','title',s.title,{required:true})}${field('Дээд жижиг бичвэр','eyebrow',s.eyebrow)}</div><div>${field('Сайтын тайлбар','subtitle',s.subtitle,{textarea:true})}</div></div>`+

 `<h3 class="themeSection">2. Background зураг</h3><div class="fields2"><div>${field('Үндсэн дэвсгэр өнгө','brand',s.brand,{type:'color'})}</div><div>${field('Хоёрдогч дэвсгэр өнгө','brand2',s.brand2,{type:'color'})}</div></div>`+
 imageInput('Дээд хэсгийн background зураг','heroBackgroundImage',s.heroBackgroundImage||'','hero')+
 imageInput('Бүх хуудасны background зураг (заавал биш)','pageBackgroundImage',s.pageBackgroundImage||'','page')+
 field('Дээд зураг дээрх бараан давхарга (%)','heroOverlay',s.heroOverlay??20,{type:'number'})+
 `<h3 class="themeSection">3. Фонт болон үсгийн хэмжээ</h3><div class="fields2"><div>${fontSelect('Ерөнхий бичвэрийн фонт','fontFamily',s.fontFamily||'Inter')}${field('Ерөнхий фонтын хэмжээ (12–21 px)','baseFontSize',s.baseFontSize||15,{type:'number'})}</div><div>${fontSelect('Гарчиг, ангиллын фонт','headingFontFamily',s.headingFontFamily||'Inter')}${field('Дээд гарчгийн хэмжээ (22–64 px)','heroTitleSize',s.heroTitleSize||36,{type:'number'})}</div></div>`+
 `<h3 class="themeSection">4. Дээд хэсгийн текстийн өнгө</h3><button class="btn colorPreset" type="button" id="grayPreset">Дээд хэсгийн бүх бичвэрийг саарал болгох (#374151)</button>`+
 `<div class="fields2"><div>${field('Том гарчгийн өнгө','heroTitleColor',colors.heroTitleColor,{type:'color'})}${field('Тайлбарын өнгө','heroSubtitleColor',colors.heroSubtitleColor,{type:'color'})}</div><div>${field('Жижиг бичвэрийн өнгө','heroEyebrowColor',colors.heroEyebrowColor,{type:'color'})}${field('Баруун шошгоны өнгө','heroBadgeColor',colors.heroBadgeColor,{type:'color'})}</div></div>`+
 `<h3 class="themeSection">5. Бусад бүх бичвэрийн өнгө</h3><button class="btn colorPreset" type="button" id="allGrayPreset">Бүх бичвэрийг бараан саарал болгох</button>`+
 `<div class="fields2"><div>${field('Ерөнхий текст','bodyTextColor',colors.bodyTextColor,{type:'color'})}${field('Туслах текст','mutedTextColor',colors.mutedTextColor,{type:'color'})}${field('Ангиллын нэр','categoryTitleColor',colors.categoryTitleColor,{type:'color'})}${field('Ангиллын тайлбар','categorySubtitleColor',colors.categorySubtitleColor,{type:'color'})}${field('Энэ хэсгийн гарчиг','sectionTitleColor',colors.sectionTitleColor,{type:'color'})}</div>`+
 `<div>${field('Оношийн нэр','diagnosisTitleColor',colors.diagnosisTitleColor,{type:'color'})}${field('Холбоосын текст','linkTextColor',colors.linkTextColor,{type:'color'})}${field('Гол товчны бичвэр','buttonTextColor',colors.buttonTextColor,{type:'color'})}${field('Доод тайлбарын текст','footerTextColor',colors.footerTextColor,{type:'color'})}</div></div>`+
 `<p class="themeSummary small">Зургаа оруулаад, өнгө болон фонтоо тохируулсны дараа баруун дээд талын <strong>«Өөрчлөлт нийтлэх»</strong> товчийг дарна. Онош, эмийн мэдээлэл болон хэрэглэгчийн зассан текст хэвээр үлдэнэ.</p>`;
 function updatePreview(){
  const el=$('sample'),p=s.heroBackgroundImage;el.style.backgroundImage=p?`linear-gradient(rgba(0,0,0,${Number(s.heroOverlay??20)/100}),rgba(0,0,0,${Number(s.heroOverlay??20)/100})),url("${p}")`:`linear-gradient(110deg,${s.brand},${s.brand2})`;

 }
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{
  let value=el.type==='number'?Number(el.value):el.value;
  if(el.type==='number'){const limits={logoWidth:[48,360],heroOverlay:[0,85],baseFontSize:[12,21],heroTitleSize:[22,64]};if(limits[el.dataset.key])value=Math.min(limits[el.dataset.key][1],Math.max(limits[el.dataset.key][0],value||0));}

 $('grayPreset').onclick=()=>setColors(['heroTitleColor','heroSubtitleColor','heroEyebrowColor','heroBadgeColor']);
 $('allGrayPreset').onclick=()=>setColors([...Object.keys(colors)]);
 wireMediaUpload($('workspace'),s,renderSettings);updatePreview();
}
function renderCategories(){
 let c=state.categories.find(x=>x.id===selectedCategory)||state.categories[0];selectedCategory=c.id;
 $('workspace').innerHTML=header('9 ангилал','Энд icon сонгох эсвэл өөрийн PNG/JPG/WEBP зураг оруулах боломжтой. Ангиллын ID хэвээр үлдэнэ.')+
 `<div class="subgrid"><div class="selectlist">${state.categories.map(x=>`<button class="listbutton ${x.id===c.id?'active':''}" data-cat="${x.id}">${esc(x.short)}</button>`).join('')}</div><div class="editor">${field('Товч нэр','short',c.short)}${field('Ангиллын бүтэн нэр','title',c.title,{textarea:true})}${field('Дэд тайлбар','subtitle',c.subtitle)}
 <div class="field"><label>Системийн icon сонгох</label><select data-key="icon">${icons.map(v=>`<option value="${v}" ${c.icon===v?'selected':''}>${v}</option>`).join('')}</select></div>
 ${imageInput('Өөрийн icon зураг оруулах','iconImage',c.iconImage||'','icon')}
 <div class="fields2">${field('Icon өнгө','color',c.color,{type:'color'})}${field('Icon дэвсгэр','bg',c.bg,{type:'color'})}</div>
 <p class="hint">Зураг оруулсан үед системийн icon-ыг орлоно. «Зураг арилгах» дарвал системийн icon буцаад харагдана.</p></div></div>`;
 $('workspace').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;renderCategories()});
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{c[el.dataset.key]=el.value;mark()});
 wireMediaUpload($('workspace'),c,renderCategories);
}
function renderProducts(){let p=state.products.find(x=>x.id===selectedProduct)||state.products[0];selectedProduct=p?.id||'';$('workspace').innerHTML=header('Эмийн бүтээгдэхүүн',`${state.products.length} бүтээгдэхүүн · нэр, эх зааврын URL, ангилал солих`, '<button class="btn primary" id="addProduct">+ Эм нэмэх</button>')+
`<div class="subgrid"><div class="selectlist">${state.products.map(x=>`<button class="listbutton ${x.id===selectedProduct?'active':''}" data-product="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div><div class="editor">${!p?'<div class="muted">Эмийн жагсаалт хоосон.</div>':
`${field('Эмийн бүтээгдэхүүний нэр','name',p.name)}<div class="field"><label>Ангилал</label><select data-key="category">${state.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div>${field('Үндсэн зурагт заасан хуудас','page',p.page,{type:'number'})}${field('Үйлдвэрлэгчийн зааврын HTTPS URL','source',p.source,{placeholder:'https://example.com/product'})}<p class="hint">Эх сурвалжгүй бол холбоосыг хоосон орхи. Хуурамч холбоос оруулахгүй.</p><hr class="divider"><div class="row between"><span class="hint">Дотоод ID: ${esc(p.id)}</span><button id="deleteProduct" class="btn danger">Эм устгах</button></div>`}</div></div>`;
 $('addProduct').onclick=()=>{let id='p_'+crypto.randomUUID().replaceAll('-','').slice(0,12);state.products.push({id,category:'pain',name:'Шинэ бүтээгдэхүүн',page:0,source:''});selectedProduct=id;mark();renderProducts();};
 $('workspace').querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{selectedProduct=b.dataset.product;renderProducts()});
 if(!p)return;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{p[el.dataset.key]=el.type==='number'?Number(el.value):el.value;mark();});
 $('deleteProduct').onclick=()=>{if(!confirm('Энэ бүтээгдэхүүнийг устгах уу? Түүнтэй холбогдсон оношийн холбоосууд мөн арилна.'))return;state.products=state.products.filter(x=>x.id!==p.id);state.diagnoses.forEach(d=>d.products=d.products.filter(k=>k!==p.id));selectedProduct=state.products[0]?.id||'';mark();renderProducts();};}
function renderDiagnoses(){let dx=state.diagnoses.find(x=>x.cat+'|'+x.code===selectedDiagnosis)||state.diagnoses[0];selectedDiagnosis=dx?dx.cat+'|'+dx.code:'';$('workspace').innerHTML=header('Оношийн код',`${state.diagnoses.length} мөр · код, тайлбар, эмийн бүтээгдэхүүний холбоосыг засна`, '<button class="btn primary" id="addDx">+ Онош нэмэх</button>')+
`<div class="subgrid"><div class="selectlist">${state.diagnoses.map(d=>{let val=d.cat+'|'+d.code;return `<button class="listbutton ${val===selectedDiagnosis?'active':''}" data-dx="${esc(val)}"><strong>${esc(d.code||'ШИНЭ')}</strong> · ${esc(d.name||'Нэр оруулах')}</button>`}).join('')}</div><div class="editor">${!dx?'<div class="muted">Оношийн жагсаалт хоосон.</div>':
`<div class="fields2">${field('ICD‑10 код','code',dx.code,{placeholder:'I10'})}<div class="field"><label>Ангилал</label><select data-key="cat">${state.categories.map(c=>`<option value="${c.id}" ${c.id===dx.cat?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div></div>${field('Оношийн Монгол нэр','name',dx.name)}<div class="fields2">${field('Кодын бүлэг','block',dx.block,{placeholder:'I10–I15'})}${field('Кодын бүлгийн тайлбар','blockName',dx.blockName)}</div><div class="field"><label>Холбооны төрөл</label><select data-key="kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${k===dx.kind?'selected':''}>${v}</option>`).join('')}</select></div>${field('Эмнэлзүйн тайлбар / анхааруулга','note',dx.note,{textarea:true})}<div class="field"><label>Холбогдох эм, бэлдмэл</label><div class="chips">${state.products.map(p=>`<label><input type="checkbox" data-linked="${esc(p.id)}" ${dx.products.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div><hr class="divider"><button id="deleteDx" class="btn danger">Оношийн мөр устгах</button>`}</div></div>`;
 $('addDx').onclick=()=>{let cat='heart',d={cat,block:'',blockName:'',code:'',name:'',products:[],kind:'context',note:''};state.diagnoses.unshift(d);selectedDiagnosis=cat+'|';mark();renderDiagnoses();};
 $('workspace').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{selectedDiagnosis=b.dataset.dx;renderDiagnoses()});
 if(!dx)return;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{dx[el.dataset.key]=el.value;mark();});
 $('workspace').querySelectorAll('[data-linked]').forEach(el=>el.onchange=()=>{dx.products=[...$('workspace').querySelectorAll('[data-linked]:checked')].map(e=>e.dataset.linked);mark();});
 $('deleteDx').onclick=()=>{if(!confirm('Оношийн мөрийг устгах уу?'))return;state.diagnoses=state.diagnoses.filter(d=>d!==dx);selectedDiagnosis=state.diagnoses[0]?state.diagnoses[0].cat+'|'+state.diagnoses[0].code:'';mark();renderDiagnoses();};}
async function renderHistory(){$('workspace').innerHTML=header('Өөрчлөлтийн түүх','Админ нийтэлсэн сүүлийн 30 шинэчлэлийг харуулна.')+'<div class="muted">Ачаалж байна…</div>';
 try{let r=await fetch('/admin/api/history',{credentials:'same-origin',cache:'no-store'});let x=await r.json();if(!r.ok)throw new Error(x.error||'Алдаа');
 $('workspace').innerHTML=header('Өөрчлөлтийн түүх','Админ нийтэлсэн сүүлийн 30 шинэчлэлийг харуулна.')+
 `<table class="history"><thead><tr><th>Хувилбар</th><th>Админ</th><th>Огноо</th></tr></thead><tbody>${x.items.map(e=>`<tr><td>${e.revision}</td><td>${esc(e.email)}</td><td>${esc(e.created_at)}</td></tr>`).join('')}</tbody></table>`;
 }catch(e){$('workspace').innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
$('save').onclick=async()=>{let button=$('save');button.disabled=true;button.textContent='Нийтэлж байна…';try{
 const r=await fetch('/admin/api/content',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json','x-icd10-request':'1'},body:JSON.stringify({revision,data:state})});const obj=await r.json();if(!r.ok){if(r.status===401)showLogin('Нэвтрэх хугацаа дууссан. Кодоо дахин оруулна уу.');throw new Error(obj.error||'Алдаа');}revision=obj.revision;clean();notify('Амжилттай нийтлэгдлээ. Нийтийн сайтыг дахин ачаалбал өөрчлөлт харагдана.',false,true);
 }catch(e){notify(e.message,true);}finally{button.textContent='Өөрчлөлт нийтлэх';button.disabled=!dirty;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

function showLogin(message='') {
 $('adminMain').hidden=true;
 $('adminControls').hidden=true;
 $('loginPanel').hidden=false;
 $('loginMsg').textContent=message;
}
async function loadAdmin() {
 try {
  const r=await fetch('/admin/api/content',{credentials:'same-origin',cache:'no-store'});
  const result=await r.json();
  if(r.status===401){showLogin();return;}
  if(!r.ok)throw new Error(result.error||'Нэвтрэх эрх эсвэл D1 тохиргоо буруу.');
  state=result.data;revision=result.revision;clean();render();
  $('adminMain').hidden=false;$('adminControls').hidden=false;$('loginPanel').hidden=true;
 }catch(e){showLogin('Админ мэдээлэл ачаалах алдаа: '+e.message);}
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const button=$('loginButton');button.disabled=true;button.textContent='Шалгаж байна…';$('loginMsg').textContent='';
 try{
  const r=await fetch('/admin/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-icd10-request':'1'},body:JSON.stringify({passcode:$('loginCode').value})});
  const result=await r.json();if(!r.ok)throw new Error(result.error||'Нэвтрэх боломжгүй байна.');
  $('loginCode').value='';await loadAdmin();
 }catch(err){$('loginMsg').textContent=err.message;}
 finally{button.disabled=false;button.textContent='Нэвтрэх';}
});
$('logout').onclick=async()=>{
 if(dirty && !confirm('Нийтлээгүй өөрчлөлт байна. Гарах уу?'))return;
 try{await fetch('/admin/api/logout',{method:'POST',credentials:'same-origin',headers:{'x-icd10-request':'1'}});}catch(_){}
 state=null;dirty=false;showLogin('Системээс гарлаа.');
};
loadAdmin();

</script></body></html>
