<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ | ICD‑10 лавлах</title><meta name="robots" content="noindex,nofollow"><style>
:root{--ink:#142b38;--teal:#135d67;--light:#f1f7f8;--line:#dbe8eb;--muted:#61717c}*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f3f7fa}input,textarea,select,button{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#104a54,#1d7480);color:#fff;padding:20px 25px}header .top{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header h1{font-size:23px;margin:0}header p{color:#d5ecee;margin:3px 0}.pill{background:#ffffff25;border:1px solid #ffffff30;border-radius:99px;padding:6px 12px;font-size:12px}a{color:#08757c}.headlink{color:white;text-decoration:none;font-weight:700}main{max-width:1250px;margin:25px auto;padding:0 22px 70px}.mainlayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.panel{background:white;border-radius:16px;border:1px solid var(--line);box-shadow:0 5px 16px #153a4908}.sidebar{padding:12px;align-self:start;position:sticky;top:15px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:14px 12px;margin:2px 0;color:#364e5c;font-weight:700}.nav:hover{background:#f1f8f9}.nav.active{background:#e1f3f2;color:#075c61}.workspace{padding:25px}.workspace h2{font-size:23px;margin:0}.sectiondesc{color:var(--muted);margin:6px 0 20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #cfdce1;border-radius:10px;padding:10px 15px;background:white;font-weight:750;color:#224453}.btn:hover{background:#edf7f8}.btn.primary{background:#0d6570;color:white;border-color:#0d6570}.btn.danger{color:#b42e48;border-color:#f3c6d0}.btn:disabled{opacity:.45;cursor:not-allowed}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field label{font-size:12px;color:#445e6d;font-weight:750}.field input,.field textarea,.field select{width:100%;border-radius:10px;border:1px solid #cedee4;padding:11px;background:white;color:#102c3c;outline:none;line-height:1.4}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#117e8a;box-shadow:0 0 0 3px #117e8a1c}.fields2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.subgrid{display:grid;grid-template-columns: minmax(200px,.85fr) minmax(0,1.8fr);gap:16px}.selectlist{height:480px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}.listbutton{border:none;display:block;width:100%;text-align:left;background:white;border-radius:9px;padding:10px;margin-bottom:3px;color:#283e4c;line-height:1.4}.listbutton:hover{background:#f2f6f9}.listbutton.active{background:#e1f3f2;color:#05616a;font-weight:750}.editor{border:1px solid var(--line);padding:17px;border-radius:12px;min-width:0}.muted{color:var(--muted)}.hint{color:var(--muted);font-size:12px}.status{margin:0 0 15px;padding:12px 15px;border:1px solid #cce2e5;background:#eaf5f6;border-radius:11px}.status.error{background:#fff2f1;border-color:#ffb6b3;color:#a62f32}.status.success{background:#eaf8f0;border-color:#a0d5b9;color:#197044}.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px;max-height:210px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fafcfd}.chips label{display:flex;gap:8px;align-items:flex-start;font-size:12px}.colorinput{max-width:120px;min-height:46px}.swatch{display:inline-block;width:25px;height:25px;border-radius:6px;border:1px solid #d1e0e2;vertical-align:middle}.divider{margin:20px 0;border:0;border-top:1px solid var(--line)}.small{font-size:12px}.eyebrow{color:#11727c;font-size:11px;font-weight:800;letter-spacing:1.7px}.empty{padding:40px;text-align:center;color:var(--muted)}#notice:empty{display:none}#dirty{color:#ffde9a;font-weight:700;font-size:12px}#dirty.saved{color:#b7eccc}.preview{border-radius:12px;padding:24px;color:white;min-height:118px}.preview strong{font-size:26px}.history{border-collapse:collapse;width:100%}.history td,.history th{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}.history th{font-size:12px;color:var(--muted)}@media(max-width:850px){.mainlayout{display:block}.sidebar{position:static;display:flex;flex-wrap:wrap;margin-bottom:16px}.nav{width:auto}.workspace{padding:16px}.subgrid,.fields2{grid-template-columns:1fr}.selectlist{height:190px}header{padding:16px}}
</style></head><body>
<header><div class="top"><div><div class="eyebrow" style="color:#b6e9e5">УДИРДЛАГЫН САМБАР</div><h1>ICD‑10 лавлах · Админ</h1><p>Загвар, ангилал, эм, ICD‑10 код, холбоос засварлах</p></div><div class="row"><span id="dirty" class="saved">Хадгалсан хувилбар</span><a class="headlink" href="/" target="_blank" rel="noopener">Нийтийн сайт ↗</a><button id="save" class="btn primary" disabled>Өөрчлөлт нийтлэх</button></div></div></header>
<main><div id="notice"></div><div class="mainlayout"><aside class="panel sidebar" id="nav"><button class="nav active" data-tab="settings">🎨 Загвар ба текст</button><button class="nav" data-tab="categories">☷ 9 ангилал</button><button class="nav" data-tab="products">💊 Эмийн бүтээгдэхүүн</button><button class="nav" data-tab="diagnoses">🩺 Оношийн код</button><button class="nav" data-tab="history">◷ Өөрчлөлтийн түүх</button></aside><section class="panel workspace" id="workspace"><div class="empty">Мэдээллийг ачаалж байна…</div></section></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=['bone','stomach','heart','lungs','brain','flask','kidney','skin','food'];
const kinds={indication:'Заалттай холбоотой',context:'Заалтыг шалгах',symptom:'Шинж тэмдгийн үед',nutrition:'Шим тэжээлийн дэмжлэг'};
let state=null,revision=null, tab='settings', selectedCategory='pain', selectedProduct='', selectedDiagnosis='',dirty=false;
function notify(s,error=false,success=false){$('notice').innerHTML=`<div class="status ${error?'error':success?'success':''}">${esc(s)}</div>`;if(success)setTimeout(()=>{if($('notice'))$('notice').innerHTML=''},6500);}
function mark(){dirty=true;$('dirty').textContent='Нийтлээгүй засвар байна';$('dirty').classList.remove('saved');$('save').disabled=false;}
function clean(){dirty=false;$('dirty').textContent='Хадгалсан хувилбар';$('dirty').classList.add('saved');$('save').disabled=true;}
function header(title,subtitle,actions=''){return `<div class="row between"><div><h2>${title}</h2><p class="sectiondesc">${subtitle}</p></div>${actions}</div>`;}
function field(label,key,value,opts={}){let component=opts.textarea?`<textarea data-key="${esc(key)}" ${opts.required?'required':''}>${esc(value)}</textarea>`:`<input data-key="${esc(key)}" type="${opts.type||'text'}" value="${esc(value)}" ${opts.required?'required':''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}>`;return `<div class="field"><label>${label}</label>${component}</div>`;}
function catName(id){return state.categories.find(c=>c.id===id)?.short||id;}
function saveInputs(form,target){form.querySelectorAll('[data-key]').forEach(e=>{const v=e.type==='number'?Number(e.value):e.value;target[e.dataset.key]=v;});}
function render(){if(!state)return;$('nav').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='settings')renderSettings();if(tab==='categories')renderCategories();if(tab==='products')renderProducts();if(tab==='diagnoses')renderDiagnoses();if(tab==='history')renderHistory();}
function renderSettings(){let s=state.settings;$('workspace').innerHTML=header('Загвар ба текст','Нийтийн сайтын гарчиг болон үндсэн өнгийг эндээс засна. Өөрчлөлтийг нийтлэх хүртэл хэрэглэгчдэд харагдахгүй.')+
`<div class="preview" id="sample" style="background:linear-gradient(110deg,${esc(s.brand)},${esc(s.brand2)})"><div id="sampleEyebrow" class="eyebrow" style="color:white">${esc(s.eyebrow)}</div><strong id="sampleTitle">${esc(s.title)}</strong><div id="sampleSub">${esc(s.subtitle)}</div></div><hr class="divider">`+
`<div class="fields2"><div>${field('Сайтын гарчиг','title',s.title,{required:true})}${field('Дээд жижиг бичвэр','eyebrow',s.eyebrow)}</div><div>${field('Сайтын тайлбар','subtitle',s.subtitle,{textarea:true})}</div></div>`+
`<div class="fields2"><div>${field('Үндсэн өнгө','brand',s.brand,{type:'color'})}</div><div>${field('Хоёрдогч өнгө','brand2',s.brand2,{type:'color'})}</div></div><p class="hint">Томоохон layout өөрчлөлт, шинэ хуудас хийх нь кодын шинэчлэлт шаарддаг. Энд үндсэн өнгө ба бичвэр шууд удирдагдана.</p>`;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{s[el.dataset.key]=el.value;mark();$('sample').style.background=`linear-gradient(110deg,${s.brand},${s.brand2})`;$('sampleTitle').textContent=s.title;$('sampleEyebrow').textContent=s.eyebrow;$('sampleSub').textContent=s.subtitle;});}
function renderCategories(){let c=state.categories.find(x=>x.id===selectedCategory)||state.categories[0];selectedCategory=c.id;$('workspace').innerHTML=header('9 ангилал','Нэр, дэд тайлбар, icon, өнгийг өөрчилж болно. Ангиллын техникийн ID хэвээр үлдэнэ.')+
`<div class="subgrid"><div class="selectlist">${state.categories.map(x=>`<button class="listbutton ${x.id===c.id?'active':''}" data-cat="${x.id}">${esc(x.short)}</button>`).join('')}</div><div class="editor">${field('Товч нэр','short',c.short)}${field('Ангиллын бүтэн нэр','title',c.title,{textarea:true})}${field('Дэд тайлбар','subtitle',c.subtitle)}<div class="field"><label>Icon</label><select data-key="icon">${icons.map(v=>`<option value="${v}" ${c.icon===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="fields2">${field('Icon өнгө','color',c.color,{type:'color'})}${field('Icon дэвсгэр','bg',c.bg,{type:'color'})}</div></div></div>`;
 $('workspace').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;renderCategories()});$('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{c[el.dataset.key]=el.value;mark();});}
function renderProducts(){let p=state.products.find(x=>x.id===selectedProduct)||state.products[0];selectedProduct=p?.id||'';$('workspace').innerHTML=header('Эмийн бүтээгдэхүүн',`${state.products.length} бүтээгдэхүүн · нэр, эх зааврын URL, ангилал солих`, '<button class="btn primary" id="addProduct">+ Эм нэмэх</button>')+
`<div class="subgrid"><div class="selectlist">${state.products.map(x=>`<button class="listbutton ${x.id===selectedProduct?'active':''}" data-product="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div><div class="editor">${!p?'<div class="muted">Эмийн жагсаалт хоосон.</div>':
`${field('Эмийн бүтээгдэхүүний нэр','name',p.name)}<div class="field"><label>Ангилал</label><select data-key="category">${state.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div>${field('Үндсэн зурагт заасан хуудас','page',p.page,{type:'number'})}${field('Үйлдвэрлэгчийн зааврын HTTPS URL','source',p.source,{placeholder:'https://example.com/product'})}<p class="hint">Эх сурвалжгүй бол холбоосыг хоосон орхи. Хуурамч холбоос оруулахгүй.</p><hr class="divider"><div class="row between"><span class="hint">Дотоод ID: ${esc(p.id)}</span><button id="deleteProduct" class="btn danger">Эм устгах</button></div>`}</div></div>`;
 $('addProduct').onclick=()=>{let id='p_'+crypto.randomUUID().replaceAll('-','').slice(0,12);state.products.push({id,category:'pain',name:'Шинэ бүтээгдэхүүн',page:0,source:''});selectedProduct=id;mark();renderProducts();};
 $('workspace').querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{selectedProduct=b.dataset.product;renderProducts()});
 if(!p)return;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{p[el.dataset.key]=el.type==='number'?Number(el.value):el.value;mark();});
 $('deleteProduct').onclick=()=>{if(!confirm('Энэ бүтээгдэхүүнийг устгах уу? Түүнтэй холбогдсон оношийн холбоосууд мөн арилна.'))return;state.products=state.products.filter(x=>x.id!==p.id);state.diagnoses.forEach(d=>d.products=d.products.filter(k=>k!==p.id));selectedProduct=state.products[0]?.id||'';mark();renderProducts();};}
function renderDiagnoses(){let dx=state.diagnoses.find(x=>x.cat+'|'+x.code===selectedDiagnosis)||state.diagnoses[0];selectedDiagnosis=dx?dx.cat+'|'+dx.code:'';$('workspace').innerHTML=header('Оношийн код',`${state.diagnoses.length} мөр · код, тайлбар, эмийн бүтээгдэхүүний холбоосыг засна`, '<button class="btn primary" id="addDx">+ Онош нэмэх</button>')+
`<div class="subgrid"><div class="selectlist">${state.diagnoses.map(d=>{let val=d.cat+'|'+d.code;return `<button class="listbutton ${val===selectedDiagnosis?'active':''}" data-dx="${esc(val)}"><strong>${esc(d.code||'ШИНЭ')}</strong> · ${esc(d.name||'Нэр оруулах')}</button>`}).join('')}</div><div class="editor">${!dx?'<div class="muted">Оношийн жагсаалт хоосон.</div>':
`<div class="fields2">${field('ICD‑10 код','code',dx.code,{placeholder:'I10'})}<div class="field"><label>Ангилал</label><select data-key="cat">${state.categories.map(c=>`<option value="${c.id}" ${c.id===dx.cat?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div></div>${field('Оношийн Монгол нэр','name',dx.name)}<div class="fields2">${field('Кодын бүлэг','block',dx.block,{placeholder:'I10–I15'})}${field('Кодын бүлгийн тайлбар','blockName',dx.blockName)}</div><div class="field"><label>Холбооны төрөл</label><select data-key="kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${k===dx.kind?'selected':''}>${v}</option>`).join('')}</select></div>${field('Эмнэлзүйн тайлбар / анхааруулга','note',dx.note,{textarea:true})}<div class="field"><label>Холбогдох эм, бэлдмэл</label><div class="chips">${state.products.map(p=>`<label><input type="checkbox" data-linked="${esc(p.id)}" ${dx.products.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div><hr class="divider"><button id="deleteDx" class="btn danger">Оношийн мөр устгах</button>`}</div></div>`;
 $('addDx').onclick=()=>{let cat='heart',d={cat,block:'',blockName:'',code:'',name:'',products:[],kind:'context',note:''};state.diagnoses.unshift(d);selectedDiagnosis=cat+'|';mark();renderDiagnoses();};
 $('workspace').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{selectedDiagnosis=b.dataset.dx;renderDiagnoses()});
 if(!dx)return;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{dx[el.dataset.key]=el.value;mark();});
 $('workspace').querySelectorAll('[data-linked]').forEach(el=>el.onchange=()=>{dx.products=[...$('workspace').querySelectorAll('[data-linked]:checked')].map(e=>e.dataset.linked);mark();});
 $('deleteDx').onclick=()=>{if(!confirm('Оношийн мөрийг устгах уу?'))return;state.diagnoses=state.diagnoses.filter(d=>d!==dx);selectedDiagnosis=state.diagnoses[0]?state.diagnoses[0].cat+'|'+state.diagnoses[0].code:'';mark();renderDiagnoses();};}
async function renderHistory(){$('workspace').innerHTML=header('Өөрчлөлтийн түүх','Админ нийтэлсэн сүүлийн 30 шинэчлэлийг харуулна.')+'<div class="muted">Ачаалж байна…</div>';
 try{let r=await fetch('/admin/api/history',{credentials:'same-origin',cache:'no-store'});let x=await r.json();if(!r.ok)throw new Error(x.error||'Алдаа');
 $('workspace').innerHTML=header('Өөрчлөлтийн түүх','Админ нийтэлсэн сүүлийн 30 шинэчлэлийг харуулна.')+
 `<table class="history"><thead><tr><th>Хувилбар</th><th>Админ</th><th>Огноо</th></tr></thead><tbody>${x.items.map(e=>`<tr><td>${e.revision}</td><td>${esc(e.email)}</td><td>${esc(e.created_at)}</td></tr>`).join('')}</tbody></table>`;
 }catch(e){$('workspace').innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
$('save').onclick=async()=>{let button=$('save');button.disabled=true;button.textContent='Нийтэлж байна…';try{
 const r=await fetch('/admin/api/content',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({revision,data:state})});const obj=await r.json();if(!r.ok)throw new Error(obj.error||'Алдаа');revision=obj.revision;clean();notify('Амжилттай нийтлэгдлээ. Нийтийн сайтыг дахин ачаалбал өөрчлөлт харагдана.',false,true);
 }catch(e){notify(e.message,true);}finally{button.textContent='Өөрчлөлт нийтлэх';button.disabled=!dirty;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
(async()=>{try{const r=await fetch('/admin/api/content',{credentials:'same-origin',cache:'no-store'});let result=await r.json();if(!r.ok)throw new Error(result.error||'Нэвтрэх эрх шаардлагатай.');state=result.data;revision=result.revision;clean();render();}catch(e){$('workspace').innerHTML=`<div class="status error"><strong>Админ өгөгдлийг ачаалж чадсангүй.</strong><p>${esc(e.message)}</p><p>Cloudflare Access нэвтрэлт, D1 Binding, ADMIN_EMAIL, CF_ACCESS_AUD, CF_ACCESS_TEAM_DOMAIN тохиргоог шалгана уу.</p></div>`;notify('Тохиргоо дутуу эсвэл админ эрх баталгаажаагүй.',true);}})();
</script></body></html>
