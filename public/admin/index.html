:root{--ink:#142b38;--teal:#135d67;--light:#f1f7f8;--line:#dbe8eb;--muted:#61717c}*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f3f7fa}input,textarea,select,button{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#104a54,#1d7480);color:#fff;padding:20px 25px}header .top{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header h1{font-size:23px;margin:0}header p{color:#d5ecee;margin:3px 0}.pill{background:#ffffff25;border:1px solid #ffffff30;border-radius:99px;padding:6px 12px;font-size:12px}a{color:#08757c}.headlink{color:white;text-decoration:none;font-weight:700}main{max-width:1250px;margin:25px auto;padding:0 22px 70px}.mainlayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.panel{background:white;border-radius:16px;border:1px solid var(--line);box-shadow:0 5px 16px #153a4908}.sidebar{padding:12px;align-self:start;position:sticky;top:15px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:14px 12px;margin:2px 0;color:#364e5c;font-weight:700}.nav:hover{background:#f1f8f9}.nav.active{background:#e1f3f2;color:#075c61}.workspace{padding:25px}.workspace h2{font-size:23px;margin:0}.sectiondesc{color:var(--muted);margin:6px 0 20px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #cfdce1;border-radius:10px;padding:10px 15px;background:white;font-weight:750;color:#224453}.btn:hover{background:#edf7f8}.btn.primary{background:#0d6570;color:white;border-color:#0d6570}.btn.danger{color:#b42e48;border-color:#f3c6d0}.btn:disabled{opacity:.45;cursor:not-allowed}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field label{font-size:12px;color:#445e6d;font-weight:750}.field input,.field textarea,.field select{width:100%;border-radius:10px;border:1px solid # 6px;display:block;margin:7px 0}.preview .sampleTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.preview .samplePill{border:1px solid currentColor;border-radius:40px;padding:5px 9px;font-size:11px;font-weight:700;opacity:.9}.preview #sampleSub{max-width:600px}.colorPreset{margin-bottom:18px}.history{border-collapse:collapse;width:100%}.history td,.history th{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}.history th{font-size:12px;color:var(--muted)}@media(max-width:850px){.mainlayout{display:block}.sidebar{position:static;display:flex;flex-wrap:wrap;margin-bottom:16px}.nav{width:auto}.workspace{padding:16px}.subgrid,.fields2{grid-template-columns:1fr}.selectlist{height:190px}header{padding:16px}}

main[hidden],#loginPanel[hidden],#adminControls[hidden]{display:none!important}
#loginPanel{max-width:480px;margin:60px auto;padding:0 20px}
.loginCard{background:#fff;border:1px solid var(--line);border-radius:19px;padding:30px;box-shadow:0 10px 35px #173f5112}
.loginCard h2{font-size:24px;margin:0 0 8px}

.loginCard label{display:block;font-weight:700;margin-bottom:7px}

</style></head><body>
<header><div class="top"><div><div class="eyebrow" style="color:#b6e9e5">УДИРДЛАГЫН САМБАР</div><h1>ICD‑10 лавлах · Админ</h1><p>Загвар, ангилал, эм, ICD‑10 код, холбоос засварлах</p></div><div class="row" id="adminControls" hidden><span id="dirty" class="saved">Хадгалсан хувилбар</span><a class="headlink" href="/" target="_blank" rel="noopener">Нийтийн сайт ↗</a><button id="save" class="btn primary" disabled>Өөрчлөлт нийтлэх</button><button id="logout" class="btn">Гарах</button></div></div></header>
<section id="loginPanel"><div class="loginCard"><div class="eyebrow">АДМИН НЭВТРЭЛТ</div><h2>Нууц кодоор нэвтрэх</h2><p>Өөрийн нууц кодыг оруулна. Бүтээгдэхүүн, ICD‑10 оношийн мэдээллийг зөвхөн админ засварлана.</p><form id="loginForm"><label for="loginCode">Админы нууц код</label><input id="loginCode" name="passcode" type="password" autocomplete="current-password" minlength="16" maxlength="128" required placeholder="Нууц кодоо оруулна уу"><button type="submit" id="loginButton" class="btn primary">Нэвтрэх</button></form><div id="loginMsg" role="alert"></div></div></section>
<main id="adminMain" hidden><div id="notice"></div><div class="mainlayout"><aside class="panel sidebar" id="nav"><button class="nav active" data-tab="settings">🎨 Загвар ба текст</button><button class="nav" data-tab="categories">☷ 9 ангилал</button><button class="nav" data-tab="products">💊 Эмийн бүтээгдэхүүн</button><button class="nav" data-tab="diagnoses">🩺 Оношийн код</button><button class="nav" data-tab="history">◷ Өөрчлөлтийн түүх</button></aside><section class="panel workspace" id="workspace"><div class="empty">Мэдээллийг ачаалж байна…</div></section></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=['bone','stomach','heart','lungs','brain','flask','kidney','skin','food'];
const kinds={indication:'Заалттай холбоотой',context:'Заалтыг шалгах',symptom:'Шинж тэмдгийн үед',nutrition:'Шим тэжээлийн дэмжлэг'};
let state=null,revision=null, tab='settings', selectedCategory='pain', selectedProduct='', selectedDiagnosis='',dirty=false;
function notify(s,error=false,success=false){$('notice').innerHTML=`<div class="status ${error?'error':success?'success':''}">${esc(s)}</div>`;if(success)setTimeout(()=>{if($('notice'))$('notice').innerHTML=''},6500);}
function mark(){dirty=true;$('dirty').textContent='Нийтлээгүй засвар байна';$('dirty').classList.remove('saved');$('save').disabled=false;}
function clean(){dirty=false;$('dirty').textContent='Хадгалсан хувилбар';$('dirty').classList.add('saved');$('save').disabled=true;}
function header(title,subtitle,actions=''){return `<div class="row between"><div><h2>${title}</h2><p class="sectiondesc">${subtitle}</p></div>${actions}</div>`;}
function field(label,key,value,opts={}){let component=opts.textarea?`<textarea data-key="${esc(key)}" ${opts.required?'required':''}>${esc(value)}</textarea>`:`<input data-key="${esc(key)}" type="${opts.type||'text'}" value="${esc(value)}" ${opts.required?'required':''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}>`;return `<div class="field"><label>${label}</label>${component}</div>`;}
function catName(id){return state.categories.find(c=>c.id===id)?.short||id;}
function saveInputs(form,target){form.querySelectorAll('[data-key]').forEach(e=>{const v=e.type==='number'?Number(e.value):e.value;target[e.dataset.key]=v;});}
function render(){if(!state)return;$('nav').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='settings')renderSettings();if(tab==='categories')renderCategories();if(tab==='products')renderProducts();if(tab==='diagnoses')renderDiagnoses();if(tab==='history')renderHistory();}
function renderSettings(){
 let s=state.settings;
 const colors={
  heroTitleColor:s.heroTitleColor||'#ffffff',
  heroSubtitleColor:s.heroSubtitleColor||'#c5e4e4',
  heroEyebrowColor:s.heroEyebrowColor||'#aeebe3',
  heroBadgeColor:s.heroBadgeColor||'#ffffff'
 };
 $('workspace').innerHTML=header('Загвар ба текст','Нийтийн сайтын гарчиг, дэвсгэр ба бичвэрийн өнгийг эндээс засна. Нийтлэх хүртэл хэрэглэгчдэд харагдахгүй.')+
 `<div class="preview" id="sample" style="background:linear-gradient(110deg,${esc(s.brand)},${esc(s.brand2)})"><div class="sampleTop"><div id="sampleEyebrow" class="eyebrow" style="color:${esc(colors.heroEyebrowColor)}">${esc(s.eyebrow)}</div><span class="samplePill" id="sampleBadge" style="color:${esc(colors.heroBadgeColor)}">ӨОУА-10 · Сонгомол кодын сан</span></div><strong id="sampleTitle" style="color:${esc(colors.heroTitleColor)}">${esc(s.title)}</strong><div id="sampleSub" style="color:${esc(colors.heroSubtitleColor)}">${esc(s.subtitle)}</div></div><hr class="divider">`+
 `<div class="fields2"><div>${field('Сайтын гарчиг','title',s.title,{required:true})}${field('Дээд жижиг бичвэр','eyebrow',s.eyebrow)}</div><div>${field('Сайтын тайлбар','subtitle',s.subtitle,{textarea:true})}</div></div>`+
 `<div class="fields2"><div>${field('Үндсэн дэвсгэр өнгө','brand',s.brand,{type:'color'})}</div><div>${field('Хоёрдогч дэвсгэр өнгө','brand2',s.brand2,{type:'color'})}</div></div>`+
 `<hr class="divider"><h3>Дээд хэсгийн текстийн өнгө</h3><p class="hint">Шар эсвэл цайвар дэвсгэртэй үед бараан саарал өнгө уншихад илүү тод харагдана.</p><button class="btn colorPreset" type="button" id="grayPreset">Бүх текстийг бараан саарал болгох (#374151)</button>`+
 `<div class="fields2"><div>${field('Том гарчгийн өнгө','heroTitleColor',colors.heroTitleColor,{type:'color'})}${field('Тайлбарын өнгө','heroSubtitleColor',colors.heroSubtitleColor,{type:'color'})}</div><div>${field('Жижиг бичвэрийн өнгө','heroEyebrowColor',colors.heroEyebrowColor,{type:'color'})}${field('Баруун шошгоны өнгө','heroBadgeColor',colors.heroBadgeColor,{type:'color'})}</div></div>`+
 `<p class="hint">Өнгө сонгох эсвэл саарал болгох товч дараад дээрх жишээг шалгана. Хүссэнээрээ болсны дараа баруун дээд талын «Өөрчлөлт нийтлэх» товчийг дарна.</p>`;
 function previewUpdate(){
  $('sample').style.background=`linear-gradient(110deg,${s.brand},${s.brand2})`;
  $('sampleTitle').textContent=s.title;
  $('sampleEyebrow').textContent=s.eyebrow;
  $('sampleSub').textContent=s.subtitle;
  $('sampleTitle').style.color=s.heroTitleColor||colors.heroTitleColor;
  $('sampleSub').style.color=s.heroSubtitleColor||colors.heroSubtitleColor;
  $('sampleEyebrow').style.color=s.heroEyebrowColor||colors.heroEyebrowColor;
  $('sampleBadge').style.color=s.heroBadgeColor||colors.heroBadgeColor;
 }
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{s[el.dataset.key]=el.value;mark();previewUpdate();});
 $('grayPreset').onclick=()=>{
  for(const key of ['heroTitleColor','heroSubtitleColor','heroEyebrowColor','heroBadgeColor']){
   s[key]='#374151';
   const input=$('workspace').querySelector(`[data-key="${key}"]`);
   if(input)input.value='#374151';
  }
  mark();previewUpdate();
 };
}
function renderCategories(){let c=state.categories.find(x=>x.id===selectedCategory)||state.categories[0];selectedCategory=c.id;$('workspace').innerHTML=header('9 ангилал','Нэр, дэд тайлбар, icon, өнгийг өөрчилж болно. Ангиллын техникийн ID хэвээр үлдэнэ.')+
`<div class="subgrid"><div class="selectlist">${state.categories.map(x=>`<button class="listbutton ${x.id===c.id?'active':''}" data-cat="${x.id}">${esc(x.short)}</button>`).join('')}</div><div class="editor">${field('Товч нэр','short',c.short)}${field('Ангиллын бүтэн нэр','title',c.title,{textarea:true})}${field('Дэд тайлбар','subtitle',c.subtitle)}<div class="field"><label>Icon</label><select data-key="icon">${icons.map(v=>`<option value="${v}" ${c.icon===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="fields2">${field('Icon өнгө','color',c.color,{type:'color'})}${field('Icon дэвсгэр','bg',c.bg,{type:'color'})}</div></div></div>`;
 $('workspace').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.cat;renderCategories()});$('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{c[el.dataset.key]=el.value;mark();});}
function renderProducts(){let p=state.products.find(x=>x.id===selectedProduct)||state.products[0];selectedProduct=p?.id||'';$('workspace').innerHTML=header('Эмийн бүтээгдэхүүн',`${state.products.length} бүтээгдэхүүн · нэр, эх зааврын URL, ангилал солих`, '<button class="btn primary" id="addProduct">+ Эм нэмэх</button>')+
`<div class="subgrid"><div class="selectlist">${state.products.map(x=>`<button class="listbutton ${x.id===selectedProduct?'active':''}" data-product="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div><div class="editor">${!p?'<div class="muted">Эмийн жагсаалт хоосон.</div>':
`${field('Эмийн бүтээгдэхүүний нэр','name',p.name)}<div class="field"><label>Ангилал</label><select data-key="category">${state.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div>${field('Үндсэн зурагт заасан хуудас','page',p.page,{type:'number'})}${field('Үйлдвэрлэгчийн зааврын HTTPS URL','source',p.source,{placeholder:'https://example.com/product'})}<p class="hint">Эх сурвалжгүй бол холбоосыг хоосон орхи. Хуурамч холбоос оруулахгүй.</p><hr class="divider"><div class="row between"><span class="hint">Дотоод ID: ${esc(p.id)}</span><button id="deleteProduct" class="btn danger">Эм устгах</button></div>`}</div></div>`;
 $('addProduct').onclick=()=>{let id='p_'+crypto.randomUUID().replaceAll('-','').slice(0,12);state.products.push({id,category:'pain',name:'Шинэ бүтээгдэхүүн',page:0,source:''});selectedProduct=id;mark();renderProducts();};
 $('workspace').querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{selectedProduct=b.dataset.product;renderProducts()});
 if(!p)return;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{p[el.dataset.key]=el.type==='number'?Number(el.value):el.value;mark();});
 $('deleteProduct').onclick=()=>{if(!confirm('Энэ бүтээгдэхүүнийг устгах уу? Түүнтэй холбогдсон оношийн холбоосууд мөн арилна.'))return;state.products=state.products.filter(x=>x.id!==p.id);state.diagnoses.forEach(d=>d.products=d.products.filter(k=>k!==p.id));selectedProduct=state.products[0]?.id||'';mark();renderProducts();};}
function renderDiagnoses(){let dx=state.diagnoses.find(x=>x.cat+'|'+x.code===selectedDiagnosis)||state.diagnoses[0];selectedDiagnosis=dx?dx.cat+'|'+dx.code:'';$('workspace').innerHTML=header('Оношийн код',`${state.diagnoses.length} мөр · код, тайлбар, эмийн бүтээгдэхүүний холбоосыг засна`, '<button class="btn primary" id="addDx">+ Онош нэмэх</button>')+
`<div class="subgrid"><div class="selectlist">${state.diagnoses.map(d=>{let val=d.cat+'|'+d.code;return `<button class="listbutton ${val===selectedDiagnosis?'active':''}" data-dx="${esc(val)}"><strong>${esc(d.code||'ШИНЭ')}</strong> · ${esc(d.name||'Нэр оруулах')}</button>`}).join('')}</div><div class="editor">${!dx?'<div class="muted">Оношийн жагсаалт хоосон.</div>':
`<div class="fields2">${field('ICD‑10 код','code',dx.code,{placeholder:'I10'})}<div class="field"><label>Ангилал</label><select data-key="cat">${state.categories.map(c=>`<option value="${c.id}" ${c.id===dx.cat?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div></div>${field('Оношийн Монгол нэр','name',dx.name)}<div class="fields2">${field('Кодын бүлэг','block',dx.block,{placeholder:'I10–I15'})}${field('Кодын бүлгийн тайлбар','blockName',dx.blockName)}</div><div class="field"><label>Холбооны төрөл</label><select data-key="kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${k===dx.kind?'selected':''}>${v}</option>`).join('')}</select></div>${field('Эмнэлзүйн тайлбар / анхааруулга','note',dx.note,{textarea:true})}<div class="field"><label>Холбогдох эм, бэлдмэл</label><div class="chips">${state.products.map(p=>`<label><input type="checkbox" data-linked="${esc(p.id)}" ${dx.products.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div><hr class="divider"><button id="deleteDx" class="btn danger">Оношийн мөр устгах</button>`}</div></div>`;
 $('addDx').onclick=()=>{let cat='heart',d={cat,block:'',blockName:'',code:'',name:'',products:[],kind:'context',note:''};state.diagnoses.unshift(d);selectedDiagnosis=cat+'|';mark();renderDiagnoses();};
 $('workspace').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{selectedDiagnosis=b.dataset.dx;renderDiagnoses()});
 if(!dx)return;
 $('workspace').querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{dx[el.dataset.key]=el.value;mark();});
 $('workspace').querySelectorAll('[data-linked]').forEach(el=>el.onchange=()=>{dx.products=[...$('workspace').querySelectorAll('[data-linked]:checked')].map(e=>e.dataset.linked);mark();});
 $('deleteDx').onclick=()=>{if(!confirm('Оношийн мөрийг устгах уу?'))return;state.diagnoses=state.diagnoses.filter(d=>d!==dx);selectedDiagnosis=state.diagnoses[0]?state.diagnoses[0].cat+'|'+state.diagnoses[0].code:'';mark();renderDiagnoses();};}
async function renderHistory(){$('workspace').innerHTML=header('Өөрчлөлтийн түүх','Админ нийтэлсэн сүүлийн 30 шинэчлэлийг харуулна.')+'<div class="muted">Ачаалж байна…</div>';
 try{let r=await fetch('/admin/api/history',{credentials:'same-origin',cache:'no-store'});let x=await r.json();if(!r.ok)throw new Error(x.error||'Алдаа');
 $('workspace').innerHTML=header('Өөрчлөлтийн түүх','Админ нийтэлсэн сүүлийн 30 шинэчлэлийг харуулна.')+
 `<table class="history"><thead><tr><th>Хувилбар</th><th>Админ</th><th>Огноо</th></tr></thead><tbody>${x.items.map(e=>`<tr><td>${e.revision}</td><td>${esc(e.email)}</td><td>${esc(e.created_at)}</td></tr>`).join('')}</tbody></table>`;
 }catch(e){$('workspace').innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
$('nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
$('save').onclick=async()=>{let button=$('save');button.disabled=true;button.textContent='Нийтэлж байна…';try{
 const r=await fetch('/admin/api/content',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json','x-icd10-request':'1'},body:JSON.stringify({revision,data:state})});const obj=await r.json();if(!r.ok){if(r.status===401)showLogin('Нэвтрэх хугацаа дууссан. Кодоо дахин оруулна уу.');throw new Error(obj.error||'Алдаа');}revision=obj.revision;clean();notify('Амжилттай нийтлэгдлээ. Нийтийн сайтыг дахин ачаалбал өөрчлөлт харагдана.',false,true);
 }catch(e){notify(e.message,true);}finally{button.textContent='Өөрчлөлт нийтлэх';button.disabled=!dirty;}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

function showLogin(message='') {
 $('adminMain').hidden=true;
 $('adminControls').hidden=true;
 $('loginPanel').hidden=false;
 $('loginMsg').textContent=message;
}
async function loadAdmin() {
 try {
  const r=await fetch('/admin/api/content',{credentials:'same-origin',cache:'no-store'});
  const result=await r.json();
  if(r.status===401){showLogin();return;}
  if(!r.ok)throw new Error(result.error||'Нэвтрэх эрх эсвэл D1 тохиргоо буруу.');
  state=result.data;revision=result.revision;clean();render();
  $('adminMain').hidden=false;$('adminControls').hidden=false;$('loginPanel').hidden=true;
 }catch(e){showLogin('Админ мэдээлэл ачаалах алдаа: '+e.message);}
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();const button=$('loginButton');button.disabled=true;button.textContent='Шалгаж байна…';$('loginMsg').textContent='';
 try{
  const r=await fetch('/admin/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-icd10-request':'1'},body:JSON.stringify({passcode:$('loginCode').value})});
  const result=await r.json();if(!r.ok)throw new Error(result.error||'Нэвтрэх боломжгүй байна.');
  $('loginCode').value='';await loadAdmin();
 }catch(err){$('loginMsg').textContent=err.message;}
 finally{button.disabled=false;button.textContent='Нэвтрэх';}
});
$('logout').onclick=async()=>{
 if(dirty && !confirm('Нийтлээгүй өөрчлөлт байна. Гарах уу?'))return;
 try{await fetch('/admin/api/logout',{method:'POST',credentials:'same-origin',headers:{'x-icd10-request':'1'}});}catch(_){}
 state=null;dirty=false;showLogin('Системээс гарлаа.');
};
loadAdmin();

</script></body></html>
